<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; background: #0b0b0b; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map', { zoomControl: false, attributionControl: false }).setView([20, 0], 2);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    var marker = null;
    // Called from Kotlin with the live GPS fix.
    window.setLocation = function (lat, lng) {
      var ll = [lat, lng];
      if (!marker) { marker = L.circleMarker(ll, { radius: 8 }).addTo(map); }
      else { marker.setLatLng(ll); }
      map.setView(ll, 16);
    };
  </script>
</body>
</html>
