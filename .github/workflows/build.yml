name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp nav/build/outputs/apk/debug/nav-debug.apk simplet-proof.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: simplet-proof-apk
          path: simplet-proof.apk
          if-no-files-found: error

      - name: Publish downloadable release
        if: github.ref_name == 'claude/relaxed-albattani-w0pn0y'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: proof
          name: Simplet proof build
          body: "Open this page on the tablet and download simplet-proof.apk to install."
          files: simplet-proof.apk
