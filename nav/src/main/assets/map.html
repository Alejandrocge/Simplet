<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="leaflet/leaflet.css" />
  <script src="leaflet/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; background: #0b0b0b; }
    #map { position: absolute; inset: 0; }

    /* Search overlay, sized for touch on a car screen */
    #searchbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
      display: flex; gap: 8px; padding: 8px;
      background: rgba(17,17,17,0.92);
      font-family: sans-serif;
    }
    #q {
      flex: 1; height: 46px; font-size: 17px; padding: 0 12px;
      border: none; border-radius: 6px; outline: none;
    }
    #go {
      height: 46px; min-width: 84px; font-size: 17px; border: none;
      border-radius: 6px; background: #1e88e5; color: #fff;
    }
    #msg {
      position: absolute; top: 62px; left: 8px; right: 8px; z-index: 1000;
      color: #fff; font-family: sans-serif; font-size: 13px;
      background: rgba(17,17,17,0.7); padding: 4px 8px; border-radius: 4px;
      display: none;
    }
    #results {
      position: absolute; top: 62px; left: 8px; right: 8px; z-index: 1001;
      background: #fff; border-radius: 6px; overflow: auto; max-height: 50%;
      font-family: sans-serif; display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .result {
      padding: 12px 14px; min-height: 24px; font-size: 15px;
      border-bottom: 1px solid #eee; color: #111;
    }
    .result:active { background: #e3f2fd; }

    /* Bottom guidance / navigation panel */
    #nav {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000;
      display: none; padding: 12px 14px;
      background: rgba(17,17,17,0.94); color: #fff; font-family: sans-serif;
    }
    #instruction { font-size: 20px; font-weight: 600; line-height: 1.25; }
    #navmeta { font-size: 14px; color: #b9c6d2; margin-top: 4px; }
    #navbtns { margin-top: 10px; display: flex; gap: 8px; }
    #navbtns button {
      height: 44px; flex: 1; font-size: 16px; border: none; border-radius: 6px; color: #fff;
    }
    #start { background: #2e7d32; }
    #end { background: #c62828; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="searchbar">
    <input id="q" type="text" placeholder="Search a destination…"
           autocomplete="off" autocorrect="off" />
    <button id="go">Search</button>
  </div>
  <div id="msg"></div>
  <div id="results"></div>

  <div id="nav">
    <div id="instruction"></div>
    <div id="navmeta"></div>
    <div id="navbtns">
      <button id="start">Start</button>
      <button id="end">End</button>
    </div>
  </div>

  <script>
    L.Icon.Default.imagePath = 'leaflet/images/';

    var map = L.map('map', { zoomControl: false }).setView([20, 0], 2);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);

    // ---------- state ----------
    var userMarker = null;
    var destMarker = null;
    var routeLine = null;
    var dest = null;          // [lat, lon]
    var steps = [];           // OSRM leg steps
    var routeCoords = [];     // [[lat,lon], ...] full geometry
    var stepIndex = 0;        // step we are currently travelling along
    var hasDest = false;
    var navMode = false;
    var lastReroute = 0;

    // ---------- small helpers ----------
    function el(id) { return document.getElementById(id); }
    function setMsg(t) { el('msg').textContent = t || ''; el('msg').style.display = t ? 'block' : 'none'; }
    function setInstruction(t) { el('instruction').textContent = t || ''; }
    function setMeta(t) { el('navmeta').textContent = t || ''; }
    function showNav(b) { el('nav').style.display = b ? 'block' : 'none'; }
    function hideResults() { el('results').style.display = 'none'; el('results').innerHTML = ''; }
    function toLL(latlng) { return [latlng.lat, latlng.lng]; }
    function manLL(step) { var l = step.maneuver.location; return [l[1], l[0]]; }
    function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

    function haversine(a, b) {
      var R = 6371000, rad = Math.PI / 180;
      var dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
      var la1 = a[0] * rad, la2 = b[0] * rad;
      var x = Math.sin(dLat / 2) * Math.sin(dLat / 2)
            + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.asin(Math.sqrt(x));
    }
    function fmtDist(m) { return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km'; }
    function fmtDur(s) {
      var m = Math.round(s / 60);
      return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
    }
    function fmtClock(dt) {
      return ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2);
    }

    function maneuverText(step) {
      var m = step.maneuver || {}, t = m.type || '', mod = m.modifier || '', name = step.name || '';
      var phrase;
      switch (t) {
        case 'depart': phrase = 'Head out'; break;
        case 'arrive': return 'Arrive at destination';
        case 'turn': phrase = (mod === 'uturn') ? 'Make a U-turn' : 'Turn ' + mod; break;
        case 'end of road': phrase = 'Turn ' + mod; break;
        case 'fork': phrase = 'Keep ' + (mod || 'straight'); break;
        case 'merge': phrase = 'Merge ' + mod; break;
        case 'on ramp': phrase = 'Take the ramp ' + mod; break;
        case 'off ramp': phrase = 'Take the exit ' + mod; break;
        case 'roundabout':
        case 'rotary': phrase = 'Take the roundabout' + (m.exit ? ', exit ' + m.exit : ''); break;
        case 'continue': phrase = 'Continue' + (mod && mod !== 'straight' ? ' ' + mod : ''); break;
        case 'new name': phrase = 'Continue'; break;
        default: phrase = cap(t || 'Continue');
      }
      return name ? phrase + ' onto ' + name : phrase;
    }

    // ---------- live GPS fix, pushed from Kotlin ----------
    window.setLocation = function (lat, lng) {
      var ll = [lat, lng];
      if (!userMarker) {
        userMarker = L.circleMarker(ll, {
          radius: 8, color: '#1e88e5', fillColor: '#1e88e5', fillOpacity: 0.9
        }).addTo(map);
      } else {
        userMarker.setLatLng(ll);
      }
      if (navMode) {
        map.panTo(ll);
        updateGuidance(ll);
      } else if (!hasDest) {
        map.setView(ll, 16);
      }
    };

    // ---------- search (Nominatim) ----------
    async function search() {
      var q = el('q').value.trim();
      if (!q) return;
      hideResults();
      setMsg('Searching “' + q + '”…');
      try {
        var url = 'https://nominatim.openstreetmap.org/search'
          + '?format=json&limit=5&q=' + encodeURIComponent(q);
        var res = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) { setMsg('Search error: HTTP ' + res.status); return; }
        var data = await res.json();
        if (!data.length) { setMsg('No results for “' + q + '”'); return; }
        setMsg(data.length + ' result(s) — tap one');
        renderResults(data);
      } catch (e) {
        setMsg('Search failed: ' + (e && e.message ? e.message : e));
      }
    }

    function renderResults(items) {
      var box = el('results');
      box.innerHTML = '';
      items.forEach(function (it) {
        var row = document.createElement('div');
        row.className = 'result';
        row.textContent = it.display_name;
        row.onclick = function () {
          pickDestination(parseFloat(it.lat), parseFloat(it.lon), it.display_name);
        };
        box.appendChild(row);
      });
      box.style.display = 'block';
    }

    // ---------- routing (OSRM) ----------
    function pickDestination(lat, lon, name) {
      hideResults();
      var ll = [lat, lon];
      dest = ll;
      hasDest = true;
      if (!destMarker) {
        destMarker = L.circleMarker(ll, {
          radius: 9, color: '#e53935', fillColor: '#e53935', fillOpacity: 0.9
        }).addTo(map);
      } else {
        destMarker.setLatLng(ll);
      }
      destMarker.bindPopup(name.split(',')[0]);
      routeTo(ll);
    }

    async function fetchRoute(from, to) {
      var url = 'https://router.project-osrm.org/route/v1/driving/'
        + from[1] + ',' + from[0] + ';' + to[1] + ',' + to[0]
        + '?overview=full&geometries=geojson&steps=true';
      var res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      if (data.code !== 'Ok' || !data.routes || !data.routes.length) {
        throw new Error(data.code || 'no route');
      }
      return data.routes[0];
    }

    function applyRoute(route) {
      routeCoords = route.geometry.coordinates.map(function (c) { return [c[1], c[0]]; });
      steps = (route.legs && route.legs[0] && route.legs[0].steps) ? route.legs[0].steps : [];
      stepIndex = 0;
      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline(routeCoords, { color: '#1e88e5', weight: 6, opacity: 0.85 }).addTo(map);
    }

    async function routeTo(to) {
      if (!userMarker) { setMsg('Waiting for your location — set it, then pick the destination again'); return; }
      setMsg('Finding route…');
      try {
        var route = await fetchRoute(toLL(userMarker.getLatLng()), to);
        applyRoute(route);
        map.fitBounds(routeLine.getBounds().pad(0.2));
        navMode = false;
        showNav(true);
        el('start').style.display = '';
        el('end').style.display = 'none';
        setInstruction('Route ready');
        setMeta(fmtDist(route.distance) + ' • ' + fmtDur(route.duration) + ' — press Start');
        setMsg('');
      } catch (e) {
        setMsg('Routing failed: ' + (e && e.message ? e.message : e));
      }
    }

    // ---------- turn-by-turn guidance ----------
    function startNav() {
      if (steps.length < 2) { setMsg('No route to follow yet'); return; }
      navMode = true;
      stepIndex = 0;
      el('start').style.display = 'none';
      el('end').style.display = '';
      if (userMarker) { map.setView(userMarker.getLatLng(), 17); updateGuidance(toLL(userMarker.getLatLng())); }
    }

    function endNav() {
      navMode = false; hasDest = false; dest = null; steps = []; routeCoords = [];
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
      showNav(false);
      setMsg('Navigation ended');
    }

    function updateGuidance(pos) {
      if (!navMode || !pos || steps.length < 2) return;
      var lastIdx = steps.length - 1;

      // Upcoming maneuver is the start of the next step.
      var tIdx = Math.min(stepIndex + 1, lastIdx);
      var d = haversine(pos, manLL(steps[tIdx]));

      // Passed the maneuver point → advance to the next step.
      if (d < 25 && stepIndex < lastIdx) {
        stepIndex++;
        tIdx = Math.min(stepIndex + 1, lastIdx);
        d = haversine(pos, manLL(steps[tIdx]));
      }

      // Arrival.
      if (stepIndex >= lastIdx - 1 && haversine(pos, manLL(steps[lastIdx])) < 30) {
        setInstruction('🏁 You have arrived');
        setMeta('');
        return;
      }

      setInstruction('In ' + fmtDist(d) + ' — ' + maneuverText(steps[tIdx]));

      var remDist = 0, remDur = 0;
      for (var i = stepIndex; i < steps.length; i++) {
        remDist += steps[i].distance || 0;
        remDur += steps[i].duration || 0;
      }
      var eta = new Date(Date.now() + remDur * 1000);
      setMeta('ETA ' + fmtClock(eta) + '  •  ' + fmtDist(remDist) + ' left  •  ' + fmtDur(remDur));

      checkReroute(pos);
    }

    function checkReroute(pos) {
      if (!routeCoords.length || !dest) return;
      var min = Infinity;
      for (var i = 0; i < routeCoords.length; i++) {
        var dd = haversine(pos, routeCoords[i]);
        if (dd < min) min = dd;
      }
      if (min > 50 && Date.now() - lastReroute > 8000) {
        lastReroute = Date.now();
        setMsg('Off route — recalculating…');
        fetchRoute(pos, dest)
          .then(function (r) { applyRoute(r); setMsg(''); })
          .catch(function (e) { setMsg('Re-route failed: ' + (e && e.message ? e.message : e)); });
      }
    }

    // ---------- wire up ----------
    el('go').onclick = search;
    el('start').onclick = startNav;
    el('end').onclick = endNav;
    el('q').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); search(); }
    });
  </script>
</body>
</html>
