<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="leaflet/leaflet.css" />
  <script src="leaflet/leaflet.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: #0b0b0b; font-family: sans-serif; }

    /* top bar */
    #searchbar { flex: 0 0 auto; display: flex; padding: 8px; background: #111; }
    #q {
      flex: 1; height: 46px; font-size: 17px; padding: 0 12px; margin-right: 8px;
      border: none; border-radius: 6px; outline: none; -webkit-appearance: none;
    }
    #go {
      height: 46px; min-width: 84px; font-size: 17px; border: none;
      border-radius: 6px; background: #1e88e5; color: #fff; -webkit-appearance: none;
    }

    /* map fills the middle */
    #mapwrap { flex: 1 1 auto; position: relative; }
    #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }

    #msg {
      position: absolute; top: 8px; left: 8px; right: 8px; z-index: 1000;
      color: #fff; font-size: 13px; background: rgba(17,17,17,0.85);
      padding: 6px 10px; border-radius: 4px; display: none;
    }
    #results {
      position: absolute; top: 8px; left: 8px; right: 8px; z-index: 1001;
      background: #fff; border-radius: 6px; overflow: auto; max-height: 70%;
      display: none; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .result { padding: 12px 14px; font-size: 15px; border-bottom: 1px solid #eee; color: #111; }
    .result:active { background: #e3f2fd; }

    /* bottom guidance bar — translateZ keeps it on its own composited layer so
       old WebViews repaint it reliably when shown/updated */
    #nav {
      flex: 0 0 auto; display: none; padding: 12px 14px; background: #111; color: #fff;
      -webkit-transform: translateZ(0); transform: translateZ(0);
    }
    #instruction { font-size: 20px; font-weight: 600; line-height: 1.25; }
    #navmeta { font-size: 14px; color: #b9c6d2; margin-top: 4px; }
    /* Start and End are never shown together, so each is a simple full-width
       block button — avoids the zero-width flex:1 bug on old WebViews. */
    #navbtns { margin-top: 10px; }
    #navbtns button {
      -webkit-appearance: none; appearance: none;
      display: block; width: 100%; height: 50px;
      font-size: 17px; border: none; border-radius: 6px; color: #fff;
    }
    #start { background: #2e7d32; }
    #end { background: #c62828; }
  </style>
</head>
<body>
  <div id="searchbar">
    <input id="q" type="text" placeholder="Search a destination…"
           autocomplete="off" autocorrect="off" />
    <button id="go">Search</button>
  </div>

  <div id="mapwrap">
    <div id="map"></div>
    <div id="msg"></div>
    <div id="results"></div>
  </div>

  <div id="nav">
    <div id="instruction"></div>
    <div id="navmeta"></div>
    <div id="navbtns">
      <button id="start">Start</button>
      <button id="end">End</button>
    </div>
  </div>

  <script>
    L.Icon.Default.imagePath = 'leaflet/images/';

    var map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([20, 0], 2);
    // Light, streets-focused raster tiles (CARTO Positron): far less detail and
    // far fewer bytes than full OpenStreetMap — easier on a weak unit and a
    // metered hotspot. keepBuffer/detectRetina trimmed to load fewer tiles.
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
      subdomains: 'abcd',
      maxZoom: 19,
      detectRetina: false,
      updateWhenZooming: false,
      keepBuffer: 1,
      attribution: '© OpenStreetMap, © CARTO'
    }).addTo(map);
    setTimeout(function () { map.invalidateSize(); }, 300);

    // ---------- state ----------
    var userMarker = null, destMarker = null, routeLine = null;
    var dest = null;          // [lat, lon]
    var maneuvers = [];       // Valhalla leg maneuvers
    var routeCoords = [];     // [[lat,lon], ...] full geometry
    var stepIndex = 0;
    var hasDest = false, navMode = false;
    var lastReroute = 0, deviceMsg = null;

    // ---------- helpers ----------
    function el(id) { return document.getElementById(id); }
    function forceRepaint(node) {
      // Old WebViews defer painting dynamically shown elements until the next
      // reflow/composite (focusing the search box was triggering it). Toggling
      // opacity with a reflow in between forces the layer to paint now.
      if (!node) return;
      node.style.opacity = '0';
      void node.offsetHeight;
      node.style.opacity = '1';
    }
    function setMsg(t) { el('msg').textContent = t || ''; el('msg').style.display = t ? 'block' : 'none'; if (t) forceRepaint(el('msg')); }
    function setInstruction(t) { el('instruction').textContent = t || ''; }
    function setMeta(t) { el('navmeta').textContent = t || ''; }
    function showNav(b) {
      el('nav').style.display = b ? 'block' : 'none';
      map.invalidateSize();
      forceRepaint(b ? el('nav') : document.body);
    }
    function setNavButtons(mode) { // 'start' | 'end'
      el('start').style.display = (mode === 'start') ? 'block' : 'none';
      el('end').style.display = (mode === 'end') ? 'block' : 'none';
      forceRepaint(el('nav'));
    }
    function hideResults() { el('results').style.display = 'none'; el('results').innerHTML = ''; }
    function toLL(latlng) { return [latlng.lat, latlng.lng]; }

    function decodePolyline(str, precision) {
      // Valhalla returns the route shape as a polyline encoded at 1e6 precision.
      var index = 0, lat = 0, lng = 0, out = [], shift, result, byte, factor = Math.pow(10, precision || 6);
      while (index < str.length) {
        shift = 0; result = 0;
        do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
        lat += (result & 1) ? ~(result >> 1) : (result >> 1);
        shift = 0; result = 0;
        do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
        lng += (result & 1) ? ~(result >> 1) : (result >> 1);
        out.push([lat / factor, lng / factor]);
      }
      return out;
    }

    function haversine(a, b) {
      var R = 6371000, rad = Math.PI / 180;
      var dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
      var la1 = a[0] * rad, la2 = b[0] * rad;
      var x = Math.sin(dLat / 2) * Math.sin(dLat / 2)
            + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.asin(Math.sqrt(x));
    }
    function fmtDist(m) { return m < 1000 ? Math.round(m) + ' m' : (m / 1000).toFixed(1) + ' km'; }
    function fmtDur(s) { var m = Math.round(s / 60); return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm'; }
    function fmtClock(dt) { return ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2); }

    // ---------- pushed from Kotlin ----------
    window.setDeviceInfo = function (text) {
      deviceMsg = text;
      setMsg(text);
      setTimeout(function () { if (el('msg').textContent === deviceMsg) setMsg(''); }, 6000);
    };

    window.setLocation = function (lat, lng) {
      var ll = [lat, lng];
      if (!userMarker) {
        userMarker = L.circleMarker(ll, { radius: 8, color: '#1e88e5', fillColor: '#1e88e5', fillOpacity: 0.9 }).addTo(map);
      } else {
        userMarker.setLatLng(ll);
      }
      if (navMode) { map.panTo(ll); updateGuidance(ll); }
      else if (!hasDest) { map.setView(ll, 16); }
    };

    // ---------- search (Nominatim) ----------
    async function search() {
      var q = el('q').value.trim();
      if (!q) return;
      el('q').blur();
      hideResults();
      setMsg('Searching “' + q + '”…');
      try {
        var here = userMarker ? toLL(userMarker.getLatLng()) : null;
        var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=8&q=' + encodeURIComponent(q);
        if (here) {
          // Bias results toward a box around the current location (soft preference).
          var d = 1.5;
          url += '&viewbox=' + (here[1] - d) + ',' + (here[0] + d) + ',' + (here[1] + d) + ',' + (here[0] - d) + '&bounded=0';
        }
        var res = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) { setMsg('Search error: HTTP ' + res.status); return; }
        var data = await res.json();
        if (!data.length) { setMsg('No results for “' + q + '”'); return; }
        if (here) {
          // Sort closest-first so nearby (in-country) places come before far ones.
          data.forEach(function (it) { it._d = haversine(here, [parseFloat(it.lat), parseFloat(it.lon)]); });
          data.sort(function (a, b) { return a._d - b._d; });
          setMsg(data.length + ' result(s) — closest first');
        } else {
          setMsg(data.length + ' result(s) — tap one');
        }
        renderResults(data);
      } catch (e) {
        setMsg('Search failed: ' + (e && e.message ? e.message : e));
      }
    }

    function renderResults(items) {
      var box = el('results');
      box.innerHTML = '';
      items.forEach(function (it) {
        var row = document.createElement('div');
        row.className = 'result';
        row.textContent = (typeof it._d === 'number' ? '(' + fmtDist(it._d) + ')  ' : '') + it.display_name;
        row.onclick = function () { pickDestination(parseFloat(it.lat), parseFloat(it.lon), it.display_name); };
        box.appendChild(row);
      });
      box.style.display = 'block';
    }

    // ---------- routing (Valhalla) ----------
    function pickDestination(lat, lon, name) {
      hideResults();
      el('q').blur();
      var ll = [lat, lon];
      dest = ll; hasDest = true;
      if (!destMarker) {
        destMarker = L.circleMarker(ll, { radius: 9, color: '#e53935', fillColor: '#e53935', fillOpacity: 0.9 }).addTo(map);
      } else {
        destMarker.setLatLng(ll);
      }
      destMarker.bindPopup(name.split(',')[0]);
      routeTo(ll);
    }

    async function fetchRoute(from, to) {
      // GET with a json= param avoids a CORS preflight (vs POST).
      var req = {
        locations: [{ lat: from[0], lon: from[1] }, { lat: to[0], lon: to[1] }],
        costing: 'auto',
        directions_options: { units: 'kilometers' }
      };
      var url = 'https://valhalla1.openstreetmap.de/route?json=' + encodeURIComponent(JSON.stringify(req));
      var res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      if (!data.trip || data.trip.status !== 0 || !data.trip.legs || !data.trip.legs.length) {
        throw new Error((data.trip && data.trip.status_message) || 'no route');
      }
      return data.trip;
    }

    function applyRoute(trip) {
      var leg = trip.legs[0];
      routeCoords = decodePolyline(leg.shape, 6);   // [[lat,lon], ...]
      maneuvers = leg.maneuvers || [];
      stepIndex = 0;
      if (routeLine) map.removeLayer(routeLine);
      routeLine = L.polyline(routeCoords, { color: '#1e88e5', weight: 6, opacity: 0.85 }).addTo(map);
    }

    async function routeTo(to) {
      if (!userMarker) { setMsg('Waiting for your location — set it, then pick the destination again'); return; }
      setMsg('Finding route…');
      try {
        var trip = await fetchRoute(toLL(userMarker.getLatLng()), to);
        applyRoute(trip);
        navMode = false;
        showNav(true);
        setInstruction('Route ready');
        setMeta(fmtDist((trip.summary.length || 0) * 1000) + ' • ' + fmtDur(trip.summary.time || 0) + ' — press Start');
        setNavButtons('start');
        map.fitBounds(routeLine.getBounds().pad(0.2));
        setMsg('');
      } catch (e) {
        setMsg('Routing failed: ' + (e && e.message ? e.message : e));
      }
    }

    // ---------- turn-by-turn guidance ----------
    function startNav() {
      if (maneuvers.length < 2) { setMsg('No route to follow yet'); return; }
      navMode = true; stepIndex = 0;
      setNavButtons('end');
      if (userMarker) { map.setView(userMarker.getLatLng(), 17); updateGuidance(toLL(userMarker.getLatLng())); }
    }

    function endNav() {
      navMode = false; hasDest = false; dest = null; maneuvers = []; routeCoords = [];
      if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
      if (destMarker) { map.removeLayer(destMarker); destMarker = null; }
      showNav(false);
      setMsg('Navigation ended');
    }

    // Valhalla maneuver i begins at routeCoords[begin_shape_index] and carries a
    // ready-made instruction string ("Turn left onto Main Street.").
    function maneuverPoint(m) { return routeCoords[m.begin_shape_index] || routeCoords[0]; }

    function updateGuidance(pos) {
      if (!navMode || !pos || maneuvers.length < 2) return;
      var lastIdx = maneuvers.length - 1;

      var tIdx = Math.min(stepIndex + 1, lastIdx);
      var d = haversine(pos, maneuverPoint(maneuvers[tIdx]));
      if (d < 25 && stepIndex < lastIdx) {
        stepIndex++;
        tIdx = Math.min(stepIndex + 1, lastIdx);
        d = haversine(pos, maneuverPoint(maneuvers[tIdx]));
      }

      var destPt = routeCoords[routeCoords.length - 1];
      if (stepIndex >= lastIdx - 1 && haversine(pos, destPt) < 30) {
        setInstruction('🏁 You have arrived'); setMeta(''); return;
      }

      setInstruction('In ' + fmtDist(d) + ' — ' + (maneuvers[tIdx].instruction || 'Continue'));
      var remDist = 0, remDur = 0;
      for (var i = stepIndex; i < maneuvers.length; i++) {
        remDist += (maneuvers[i].length || 0) * 1000;
        remDur += maneuvers[i].time || 0;
      }
      setMeta('ETA ' + fmtClock(new Date(Date.now() + remDur * 1000)) + '  •  ' + fmtDist(remDist) + ' left  •  ' + fmtDur(remDur));
      checkReroute(pos);
    }

    function checkReroute(pos) {
      if (!routeCoords.length || !dest) return;
      var min = Infinity;
      for (var i = 0; i < routeCoords.length; i++) { var dd = haversine(pos, routeCoords[i]); if (dd < min) min = dd; }
      if (min > 50 && Date.now() - lastReroute > 8000) {
        lastReroute = Date.now();
        setMsg('Off route — recalculating…');
        fetchRoute(pos, dest)
          .then(function (r) { applyRoute(r); setMsg(''); })
          .catch(function (e) { setMsg('Re-route failed: ' + (e && e.message ? e.message : e)); });
      }
    }

    // ---------- wire up ----------
    el('go').onclick = search;
    el('start').onclick = startNav;
    el('end').onclick = endNav;
    el('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); search(); } });
  </script>
</body>
</html>
